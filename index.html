<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistema de Gestão</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) { return false; }
    };
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

  <style>
    :root { --primary: #10b981; --primary-hover: #059669; --sidebar-dark: #0f172a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .sidebar-active { background-color: rgba(255, 255, 255, 0.1); border-left: 4px solid var(--primary); }
    #auth-screen { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="flex min-h-screen text-slate-800">

  <!-- Tela de Login SaaS -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden">
      <div class="text-center mb-8">
        <div id="auth-logo-preview" class="text-4xl block mb-2 flex justify-center h-16 w-full object-contain">📦</div>
        <h1 id="auth-brand-name" class="text-2xl font-bold text-slate-800 uppercase">ESTOQUEPRO 360</h1>
        <p class="text-sm text-slate-500 mt-1">Acesso ao Painel</p>
      </div>
      
      <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault(); handleAuth();">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail</label>
          <input type="email" id="auth-email" class="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-slate-50 focus:border-emerald-500" required />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Senha</label>
          <input type="password" id="auth-password" class="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-slate-50 focus:border-emerald-500" required minlength="6" />
        </div>
        <div class="pt-2 flex flex-col gap-3">
          <button type="submit" id="btn-login" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow-lg">Entrar no Sistema</button>
          <button type="button" onclick="handleSignUp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-lg transition-colors">Criar Conta (30 dias grátis)</button>
        </div>
      </form>
    </div>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar Personalizada -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 bg-slate-900 text-slate-200 w-64 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="sidebar-logo" class="text-2xl h-8 w-8 flex items-center justify-center bg-slate-800 rounded-lg overflow-hidden">📦</div>
        <div>
          <h1 id="sidebar-brand-name" class="font-bold text-sm tracking-tight leading-tight text-white uppercase">ESTOQUEPRO 360</h1>
        </div>
      </div>
      <button class="md:hidden text-white text-xl" onclick="toggleSidebar()">✕</button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
      <div class="text-[10px] font-bold text-slate-500 px-3 uppercase tracking-wider mb-2">Visão Geral</div>
      <button onclick="switchTab('dashboard')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all sidebar-active" data-tab="dashboard"><span>📊</span> Painel de Controle</button>
      
      <div class="text-[10px] font-bold text-slate-500 px-3 uppercase tracking-wider mt-6 mb-2">Estoque</div>
      <button onclick="switchTab('inventory')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="inventory"><span>📦</span> Produtos Cadastrados</button>
      <button onclick="switchTab('stock-in')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="stock-in"><span>📥</span> Entrada de Mercadoria</button>
      <button onclick="switchTab('stock-out')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="stock-out"><span>📤</span> Saída de Mercadoria</button>
      <button onclick="switchTab('reorder')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="reorder"><span>🔄</span> Planejar Reposição</button>
      <button onclick="switchTab('stocktake')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="stocktake"><span>📋</span> Inventário Físico</button>

      <div class="text-[10px] font-bold text-slate-500 px-3 uppercase tracking-wider mt-6 mb-2">Negócios</div>
      <button onclick="switchTab('suppliers')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="suppliers"><span>🏭</span> Fornecedores</button>
      <button onclick="switchTab('analytics')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="analytics"><span>📈</span> Análises & Gráficos</button>
      <button onclick="switchTab('valuation')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="valuation"><span>💰</span> Avaliação de Estoque</button>

      <div class="text-[10px] font-bold text-slate-500 px-3 uppercase tracking-wider mt-6 mb-2">Sistema</div>
      <button onclick="switchTab('settings')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="settings"><span>⚙️</span> Configurações e Perfil</button>
    </nav>

    <div class="p-4 border-t border-slate-800 space-y-2">
      <button onclick="logoutSaaS()" class="w-full bg-slate-800 hover:bg-rose-900 text-slate-300 hover:text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition-all">🚪 Sair da Conta</button>
    </div>
  </aside>

  <div class="flex-1 md:ml-64 flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="md:hidden text-2xl hover:bg-slate-100 p-1.5 rounded-lg transition-colors">☰</button>
        <h2 id="current-section-title" class="text-lg font-bold text-slate-800">📊 Painel de Controle</h2>
      </div>
      <div class="flex items-center gap-3">
        <span id="cloud-status" class="text-[10px] font-bold text-emerald-600 uppercase flex items-center gap-1 bg-emerald-50 px-2 py-1 rounded-full border border-emerald-100"><span class="animate-pulse">☁️</span> Sincronizado</span>
      </div>
    </header>

    <main id="main-content" class="flex-1 p-6 space-y-6">
      <div id="tab-dashboard" class="tab-content space-y-6"></div>
      <div id="tab-inventory" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stock-in" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stock-out" class="tab-content space-y-6 hidden"></div>
      <div id="tab-reorder" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stocktake" class="tab-content space-y-6 hidden"></div>
      <div id="tab-suppliers" class="tab-content space-y-6 hidden"></div>
      <div id="tab-analytics" class="tab-content space-y-6 hidden"></div>
      <div id="tab-valuation" class="tab-content space-y-6 hidden"></div>
      <div id="tab-settings" class="tab-content space-y-6 hidden"></div>
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 space-y-2 z-50"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW erro:', err)); });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyA5KTR4ydkmntoexUH74mHDTkTKXpdF6a4",
      authDomain: "estoque-planeta-5424f.firebaseapp.com",
      projectId: "estoque-planeta-5424f",
      storageBucket: "estoque-planeta-5424f.firebasestorage.app",
      messagingSenderId: "918015681263",
      appId: "1:918015681263:web:c57480e7409e2fdd47711a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let docRef = null; 
    let currentUser = null;

    let AppState = {
      products: [], stockIn: [], stockOut: [], suppliers: [], stocktakes: [],
      categories: ["Sem Categoria", "Copos", "Canecas", "Camisetas", "Brindes", "Insumos", "Embalagens"],
      settings: { currency: "BRL", lowThreshold: 5, reorderMultiplier: 2, companyName: "ESTOQUEPRO 360", companyLogo: "" }
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        const creationTime = new Date(user.metadata.creationTime).getTime();
        const now = new Date().getTime();
        const daysUsed = (now - creationTime) / (1000 * 3600 * 24);

        if (daysUsed > 30) {
          alert("Seu período de teste de 30 dias expirou! Contate o administrador.");
          auth.signOut();
          return;
        }

        docRef = db.collection("clientes_saas").doc(user.uid);
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("auth-screen").classList.remove("flex");
        loadDataFromCloud();
      } else {
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("auth-screen").classList.add("flex");
      }
    });

    function handleAuth() {
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;
      auth.signInWithEmailAndPassword(email, pass).catch(() => showToast("Erro ao entrar. E-mail ou senha incorretos.", "error"));
    }

    function handleSignUp() {
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;
      if(pass.length < 6) { showToast("A senha precisa ter no mínimo 6 caracteres.", "error"); return; }
      auth.createUserWithEmailAndPassword(email, pass)
        .then(() => showToast("Conta criada com sucesso! 30 dias grátis liberados."))
        .catch(error => showToast("Erro: " + error.message, "error"));
    }

    function logoutSaaS() {
      if(confirm("Deseja sair da sua conta?")) {
        auth.signOut();
        AppState = { products: [], stockIn: [], stockOut: [], suppliers: [], stocktakes: [], categories: [], settings: {} };
        switchTab("dashboard");
      }
    }

    async function loadDataFromCloud() {
      document.getElementById("cloud-status").innerHTML = `<span class="animate-spin">🔄</span> Sync...`;
      try {
        const docSnap = await docRef.get();
        if (docSnap.exists) {
          const data = docSnap.data();
          AppState = { ...AppState, ...data };
          if(!AppState.settings.companyName) AppState.settings.companyName = "ESTOQUEPRO 360";
        } else {
          await docRef.set(AppState);
        }
        applyBranding();
        document.getElementById("cloud-status").innerHTML = `<span class="animate-pulse">☁️</span> OK`;
        switchTab("dashboard");
      } catch (error) {
        showToast("Erro de conexão.", "error");
      }
    }

    async function saveToCloud() {
      if (!docRef) return;
      try {
        document.getElementById("cloud-status").innerHTML = `<span class="animate-spin">🔄</span> Salvando...`;
        await docRef.set(AppState);
        setTimeout(() => { document.getElementById("cloud-status").innerHTML = `<span class="animate-pulse">☁️</span> OK`; }, 500);
      } catch (error) { showToast("Erro ao salvar!", "error"); }
    }

    // --- SISTEMA DE WHITE-LABEL (CUSTOMIZAÇÃO DA MARCA) ---
    function applyBranding() {
      const name = AppState.settings.companyName || "ESTOQUEPRO 360";
      const logo = AppState.settings.companyLogo;

      document.getElementById("sidebar-brand-name").innerText = name;
      document.getElementById("auth-brand-name").innerText = name;

      const logoEls = [document.getElementById("sidebar-logo"), document.getElementById("auth-logo-preview")];
      logoEls.forEach(el => {
        if(logo) {
          el.innerHTML = `<img src="${logo}" class="h-full w-full object-contain" />`;
          el.classList.remove("bg-slate-800"); 
        } else {
          el.innerHTML = "📦";
        }
      });
    }

    // Modal Global
    function openModal(title, formHtml, onConfirm = null) {
      let overlay = document.getElementById("global-modal-overlay");
      if (!overlay) {
        overlay = document.createElement("div"); overlay.id = "global-modal-overlay";
        overlay.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300";
        document.body.appendChild(overlay);
      }
      overlay.innerHTML = `
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 max-w-lg w-full transform transition-all duration-300 scale-95 opacity-0 flex flex-col max-h-[90vh]">
          <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between"><h3 class="font-bold text-lg text-slate-800">${title}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">✕</button></div>
          <div class="px-6 py-5 overflow-y-auto flex-1 text-sm text-slate-600 leading-relaxed space-y-4">${formHtml}</div>
          <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-2 rounded-b-xl"><button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg">Cancelar</button><button id="modal-submit-btn" class="px-4 py-2 bg-emerald-600 text-white font-medium rounded-lg">${onConfirm ? "Confirmar" : "Salvar"}</button></div>
        </div>`;
      setTimeout(() => { overlay.firstElementChild.classList.remove("scale-95", "opacity-0"); overlay.firstElementChild.classList.add("scale-100", "opacity-100"); }, 50);
      document.getElementById("modal-submit-btn").onclick = () => { if (onConfirm) onConfirm(); else closeModal(); };
    }
    function closeModal() { const overlay = document.getElementById("global-modal-overlay"); if (overlay) { overlay.firstElementChild.classList.remove("scale-100", "opacity-100"); overlay.firstElementChild.classList.add("scale-95", "opacity-0"); setTimeout(() => overlay.remove(), 150); } }
    function formatCurrency(amount) { return (amount || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function formatDate(dateStr) { if (!dateStr) return "-"; const parts = dateStr.split("-"); if (parts.length === 3) { return `${parts[2]}/${parts[1]}/${parts[0]}`; } return dateStr; }
    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("-translate-x-full"); document.getElementById("sidebar-overlay").classList.toggle("hidden"); }
    function showToast(message, type = "success") {
      const colors = { success: "bg-emerald-600 text-white", error: "bg-red-600 text-white" };
      const toast = document.createElement("div"); toast.className = `${colors[type]} px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3 text-sm min-w-[280px] transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white font-bold">✕</button>`;
      document.getElementById("toast-container").appendChild(toast);
      setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 50);
      setTimeout(() => { toast.classList.add("opacity-0", "translate-y-2"); setTimeout(() => toast.remove(), 300); }, 4000);
    }

    function switchTab(tabId) {
      document.querySelectorAll(".nav-item").forEach(btn => { btn.classList.remove("sidebar-active"); if (btn.dataset.tab === tabId) btn.classList.add("sidebar-active"); });
      document.querySelectorAll(".tab-content").forEach(view => view.classList.add("hidden"));
      const activeTab = document.getElementById(`tab-${tabId}`);
      if (activeTab) activeTab.classList.remove("hidden");
      const titles = { dashboard: "📊 Painel de Controle", inventory: "📦 Produtos Cadastrados", "stock-in": "📥 Entrada de Mercadoria", "stock-out": "📤 Saída de Mercadoria", reorder: "🔄 Planejar Reposição", stocktake: "📋 Inventário Físico", suppliers: "🏭 Fornecedores", analytics: "📈 Análises & Gráficos", valuation: "💰 Avaliação de Estoque", settings: "⚙️ Configurações e Perfil" };
      document.getElementById("current-section-title").innerText = titles[tabId] || "Visão Geral";
      if (!document.getElementById("sidebar").classList.contains("-translate-x-full")) toggleSidebar();
      renderTabContent(tabId);
    }

    function renderTabContent(tabId) { 
      switch (tabId) { case "dashboard": renderDashboard(); break; case "inventory": renderInventory(); break; case "stock-in": renderStockIn(); break; case "stock-out": renderStockOut(); break; case "reorder": renderReorder(); break; case "stocktake": renderStocktake(); break; case "suppliers": renderSuppliers(); break; case "analytics": renderAnalytics(); break; case "valuation": renderValuation(); break; case "settings": renderSettings(); break; } 
    }

    // ==========================================
    // RENDERIZAÇÃO DAS TELAS ORIGINAIS RESTAURADAS
    // ==========================================
    function renderDashboard() {
      const container = document.getElementById("tab-dashboard");
      const skusCount = AppState.products.length;
      const totalUnits = AppState.products.reduce((acc, p) => acc + Number(p.currentStock || 0), 0);
      const totalValue = AppState.products.reduce((acc, p) => acc + (Number(p.currentStock || 0) * Number(p.costPrice || 0)), 0);
      
      const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      let revenue30d = 0; let cogs30d = 0;
      AppState.stockOut.forEach(outItem => {
        const itemDate = new Date(outItem.date);
        if (itemDate >= thirtyDaysAgo && outItem.type === "Venda") {
          const qty = Number(outItem.quantity || 0); revenue30d += qty * Number(outItem.price || 0);
          const prod = AppState.products.find(p => p.id === outItem.productId);
          if (prod) cogs30d += qty * Number(prod.costPrice || 0);
        }
      });
      const grossProfit30d = revenue30d - cogs30d;
      const margin30d = revenue30d > 0 ? (grossProfit30d / revenue30d) * 100 : 0;
      const lowStockItems = AppState.products.filter(p => Number(p.currentStock || 0) <= Number(p.reorderThreshold || AppState.settings.lowThreshold) && Number(p.currentStock || 0) > 0);
      const outOfStockItems = AppState.products.filter(p => Number(p.currentStock || 0) === 0);

      container.innerHTML = `
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="glass-card p-5 rounded-2xl flex items-center gap-4"><div class="text-3xl bg-indigo-50 p-3 rounded-xl">📦</div><div><div class="text-2xl font-bold text-slate-800">${skusCount}</div><div class="text-[10px] font-bold text-slate-500 uppercase">SKUs Ativos</div></div></div>
          <div class="glass-card p-5 rounded-2xl flex items-center gap-4"><div class="text-3xl bg-blue-50 p-3 rounded-xl">🏷️</div><div><div class="text-2xl font-bold text-slate-800">${totalUnits}</div><div class="text-[10px] font-bold text-slate-500 uppercase">Peças no Estoque</div></div></div>
          <div class="glass-card p-5 rounded-2xl flex items-center gap-4"><div class="text-3xl bg-emerald-50 p-3 rounded-xl">💵</div><div><div class="text-lg font-bold text-slate-800">${formatCurrency(totalValue)}</div><div class="text-[10px] font-bold text-slate-500 uppercase">Valor Ativo</div></div></div>
          <div class="glass-card p-5 rounded-2xl flex items-center gap-4 border-l-4 border-amber-500"><div class="text-3xl bg-amber-50 p-3 rounded-xl">🟡</div><div><div class="text-2xl font-bold text-amber-700">${lowStockItems.length}</div><div class="text-[10px] font-bold text-slate-500 uppercase">Estoque Baixo</div></div></div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-2">
          <div class="glass-card p-5 rounded-2xl lg:col-span-2 h-72">
            <h3 class="font-bold text-slate-800 mb-4">📈 Faturamento Recente</h3>
            <canvas id="dashboard-chart-revenue"></canvas>
          </div>
          <div class="glass-card p-5 rounded-2xl flex flex-col h-72">
            <h3 class="font-bold text-slate-800 mb-3 text-sm">⚠️ Alertas Críticos</h3>
            <div class="overflow-y-auto flex-1 space-y-2 pr-1">
              ${[...lowStockItems, ...outOfStockItems].length === 0 ? `<div class="text-center py-10 text-slate-400 text-sm">Tudo OK! Sem alertas.</div>` : [...lowStockItems, ...outOfStockItems].map(p => {
                const isOut = Number(p.currentStock) === 0;
                return `<div class="p-2 rounded-lg border text-sm flex items-center justify-between ${isOut ? 'bg-red-50 border-red-100 text-red-800' : 'bg-amber-50 border-amber-100 text-amber-800'}"><div><strong class="font-semibold block truncate w-32">${p.name}</strong></div><div class="text-right font-bold text-xs">${p.currentStock} und.</div></div>`;
              }).join("")}
            </div>
          </div>
        </div>
      `;
      initDashboardCharts(thirtyDaysAgo);
    }

    function initDashboardCharts(startDate) {
      const dates = []; const revenueDaily = []; const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const d = new Date(); d.setDate(today.getDate() - i);
        dates.push(d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }));
        const dStr = d.toISOString().split("T")[0];
        const dayTotal = AppState.stockOut.filter(item => item.date === dStr && item.type === "Venda").reduce((sum, item) => sum + (Number(item.quantity) * Number(item.price)), 0);
        revenueDaily.push(dayTotal);
      }

    function handleImageUpload(event, base64Id, previewId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const b64 = e.target.result;
          document.getElementById(base64Id).value = b64;
          const preview = document.getElementById(previewId);
          preview.src = b64; preview.classList.remove("hidden");
          const textEl = document.getElementById("drop-zone-text"); if(textEl) textEl.classList.add("hidden");
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProductForm() {
      const id = document.getElementById("form-p-id").value;
      const name = document.getElementById("form-p-name").value;
      const sku = document.getElementById("form-p-sku").value.toUpperCase();
      if (!name || !sku) { showToast("Preencha nome e SKU!", "error"); return; }
      
      const payload = {
        name: name, sku: sku, category: document.getElementById("form-p-cat").value,
        costPrice: parseFloat(document.getElementById("form-p-cost").value) || 0,
        sellingPrice: parseFloat(document.getElementById("form-p-sell").value) || 0,
        reorderThreshold: parseInt(document.getElementById("form-p-limit").value) || 5,
        image: document.getElementById("form-p-img-base64").value
      };

      if (id) {
        const p = AppState.products.find(item => item.id === id);
        if (p) Object.assign(p, payload);
        showToast("Produto editado!");
      } else {
        payload.id = "prod_" + Math.random().toString(36).substr(2, 9);
        payload.currentStock = parseInt(document.getElementById("form-p-qty").value) || 0;
        AppState.products.push(payload);
        showToast("Produto cadastrado!");
      }
      saveToCloud(); closeModal(); renderInventory();
    }

                <button onclick="addNewSystemCategory()" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg">Adicionar</button>
              </div>
              <div class="border rounded-xl p-2 bg-slate-50 max-h-40 overflow-y-auto divide-y">
                ${AppState.categories.map(cat => `<div class="flex items-center justify-between py-2 px-2 text-sm text-slate-700 font-semibold"><span>${cat}</span><button onclick="removeSystemCategory('${cat}')" class="text-red-500 hover:text-red-700 font-bold">✕</button></div>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function saveBranding() {
      const name = document.getElementById("set-company-name").value;
      const logo = document.getElementById("set-company-logo-b64").value;
      AppState.settings.companyName = name;
      AppState.settings.companyLogo = logo;
      saveToCloud();
      applyBranding();
      showToast("Identidade visual salva e aplicada!");
    }

    function saveGlobalSettingsParams() {
      AppState.settings.lowThreshold = parseInt(document.getElementById("set-low-limit").value) || 0;
      AppState.settings.reorderMultiplier = parseInt(document.getElementById("set-multiplier").value) || 1;
      saveToCloud(); showToast("Parâmetros do sistema salvos!");
    }

    function addNewSystemCategory() {
      const name = document.getElementById("set-new-cat").value.trim();
      if (!name) return;
      if (AppState.categories.includes(name)) return showToast("Categoria já existe!", "error");
      AppState.categories.push(name); saveToCloud(); renderSettings();
    }
    
    function removeSystemCategory(cat) {
      if (confirm(`Remover a categoria "${cat}"?`)) { AppState.categories = AppState.categories.filter(c => c !== cat); saveToCloud(); renderSettings(); }
    }
  </script>
</body>
</html>
