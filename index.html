<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESTOQUEPRO 360 - Sistema de Gestão</title>
  
  <!-- Configurações PWA (Instalar no celular) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Scripts Anticópia (Bloqueio F12, Botão Direito, Ctrl+U) -->
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
        (e.ctrlKey && e.keyCode === 85)
      ) { return false; }
    };
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Bibliotecas do Firebase (Agora com Auth) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

  <style>
    :root { --primary: #10b981; --primary-hover: #059669; --sidebar-dark: #0f172a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; user-select: none; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .sidebar-active { background-color: rgba(255, 255, 255, 0.1); border-left: 4px solid var(--primary); }
  </style>
</head>
<body class="flex min-h-screen text-slate-800">

  <!-- Tela de Login / Cadastro (Overlay SaaS) -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-8">
        <span class="text-4xl block mb-2">📦</span>
        <h1 class="text-2xl font-bold text-slate-800">ESTOQUEPRO 360</h1>
        <p class="text-sm text-slate-500">Acesse ou crie sua conta (30 dias grátis)</p>
      </div>
      
      <form id="auth-form" class="space-y-4" onsubmit="event.preventDefault(); handleAuth();">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail</label>
          <input type="email" id="auth-email" class="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-slate-50 focus:border-emerald-500" required />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Senha</label>
          <input type="password" id="auth-password" class="w-full border rounded-lg px-3 py-2 text-sm outline-none bg-slate-50 focus:border-emerald-500" required minlength="6" />
        </div>
        <div class="pt-2 flex flex-col gap-3">
          <button type="submit" id="btn-login" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition-colors">
            Entrar no Painel
          </button>
          <button type="button" onclick="handleSignUp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-lg transition-colors">
            Criar Nova Conta Grátis
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sidebar Overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 bg-slate-900 text-slate-200 w-64 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col">
    <div class="p-6 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📦</span>
        <div>
          <h1 class="font-bold text-lg tracking-tight leading-none text-white">ESTOQUEPRO 360</h1>
          <span class="text-xs text-slate-400">Controle Inteligente</span>
        </div>
      </div>
      <button class="md:hidden text-white text-xl" onclick="toggleSidebar()">✕</button>
    </div>

    <!-- Navegacão -->
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
      <div class="text-xs font-semibold text-slate-400 px-3 uppercase tracking-wider mb-2">Visão Geral</div>
      <button onclick="switchTab('dashboard')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all sidebar-active" data-tab="dashboard"><span>📊</span> Painel de Controle</button>
      
      <div class="text-xs font-semibold text-slate-400 px-3 uppercase tracking-wider mt-6 mb-2">Estoque</div>
      <button onclick="switchTab('inventory')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="inventory"><span>📦</span> Produtos Cadastrados</button>
      <button onclick="switchTab('stock-in')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="stock-in"><span>📥</span> Entrada de Mercadoria</button>
      <button onclick="switchTab('stock-out')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="stock-out"><span>📤</span> Saída de Mercadoria</button>
      <button onclick="switchTab('reorder')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="reorder"><span>🔄</span> Planejar Reposição</button>
      
      <div class="text-xs font-semibold text-slate-400 px-3 uppercase tracking-wider mt-6 mb-2">Negócios</div>
      <button onclick="switchTab('suppliers')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="suppliers"><span>🏭</span> Fornecedores</button>
      <button onclick="switchTab('analytics')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="analytics"><span>📈</span> Análises & Gráficos</button>
      <button onclick="switchTab('valuation')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="valuation"><span>💰</span> Avaliação de Estoque</button>

      <div class="text-xs font-semibold text-slate-400 px-3 uppercase tracking-wider mt-6 mb-2">Sistema</div>
      <button onclick="switchTab('settings')" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition-all" data-tab="settings"><span>⚙️</span> Configurações</button>
    </nav>

    <!-- Sidebar Rodapé -->
    <div class="p-4 border-t border-slate-800 space-y-2">
      <button onclick="exportBackup()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition-all">💾 Exportar Backup</button>
      <button onclick="logoutSaaS()" class="w-full bg-slate-800 hover:bg-rose-900 text-slate-300 hover:text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition-all">🚪 Sair da Conta</button>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 md:ml-64 flex flex-col min-h-screen">
    <header class="bg-white border-b border-slate-200 h-16 px-6 flex items-center justify-between sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <button onclick="toggleSidebar()" class="md:hidden text-2xl hover:bg-slate-100 p-1.5 rounded-lg transition-colors">☰</button>
        <h2 id="current-section-title" class="text-lg font-bold text-slate-800">📊 Painel de Controle</h2>
      </div>
      <div class="flex items-center gap-2">
        <span id="cloud-status" class="text-xs font-bold text-emerald-600 flex items-center gap-1 bg-emerald-50 px-2 py-1 rounded border border-emerald-100">
          <span class="animate-pulse">☁️</span> Autenticando...
        </span>
      </div>
    </header>

    <!-- Main Views -->
    <main id="main-content" class="flex-1 p-6 space-y-6">
      <div id="tab-dashboard" class="tab-content space-y-6"></div>
      <div id="tab-inventory" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stock-in" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stock-out" class="tab-content space-y-6 hidden"></div>
      <div id="tab-reorder" class="tab-content space-y-6 hidden"></div>
      <div id="tab-stocktake" class="tab-content space-y-6 hidden"></div>
      <div id="tab-suppliers" class="tab-content space-y-6 hidden"></div>
      <div id="tab-analytics" class="tab-content space-y-6 hidden"></div>
      <div id="tab-valuation" class="tab-content space-y-6 hidden"></div>
      <div id="tab-settings" class="tab-content space-y-6 hidden"></div>
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 space-y-2 z-50"></div>

  <!-- Core Script SaaS -->
  <script>
    // --- REGISTRO DO SERVICE WORKER (PWA) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('App PWA Instalável Ativo');
        }).catch(err => console.log('Erro no SW:', err));
      });
    }

    // --- CONFIGURAÇÃO DO FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyA5KTR4ydkmntoexUH74mHDTkTKXpdF6a4",
      authDomain: "estoque-planeta-5424f.firebaseapp.com",
      projectId: "estoque-planeta-5424f",
      storageBucket: "estoque-planeta-5424f.firebasestorage.app",
      messagingSenderId: "918015681263",
      appId: "1:918015681263:web:c57480e7409e2fdd47711a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let docRef = null; 
    let currentUser = null;

    let AppState = {
      products: [], stockIn: [], stockOut: [], suppliers: [], stocktakes: [],
      categories: ["Sem Categoria", "Copos e Taças", "Canecas", "Camisetas", "Brindes", "Insumos", "Embalagens"],
      settings: { currency: "BRL", lowThreshold: 5, reorderMultiplier: 2 }
    };

    // --- SISTEMA DE LOGIN, MULTI-TENANT E 30 DIAS ---
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        
        // Verifica Trava de 30 Dias
        const creationTime = new Date(user.metadata.creationTime).getTime();
        const now = new Date().getTime();
        const daysUsed = (now - creationTime) / (1000 * 3600 * 24);

        if (daysUsed > 30) {
          alert("Aviso: Seu período de teste de 30 dias expirou! Redirecionando para página de renovação...");
          // Aqui você coloca o link de pagamento futuro: window.location.href = "https://seu-checkout.com";
          auth.signOut();
          return;
        }

        // Define a "Pasta" isolada deste cliente no banco de dados
        docRef = db.collection("clientes_saas").doc(user.uid);
        
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("auth-screen").classList.remove("flex");
        
        loadDataFromCloud();
      } else {
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("auth-screen").classList.add("flex");
      }
    });

    function handleAuth() {
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;
      auth.signInWithEmailAndPassword(email, pass)
        .catch(error => showToast("Erro ao entrar. Verifique seus dados.", "error"));
    }

    function handleSignUp() {
      const email = document.getElementById("auth-email").value;
      const pass = document.getElementById("auth-password").value;
      if(pass.length < 6) { showToast("A senha precisa ter no mínimo 6 caracteres.", "error"); return; }
      
      auth.createUserWithEmailAndPassword(email, pass)
        .then(() => showToast("Conta criada com sucesso! Você tem 30 dias grátis."))
        .catch(error => showToast("Erro ao criar conta: O e-mail já existe ou é inválido.", "error"));
    }

    function logoutSaaS() {
      if(confirm("Deseja sair da sua conta?")) {
        auth.signOut();
        // Limpa a tela para não vazar dados
        AppState = { products: [], stockIn: [], stockOut: [], suppliers: [], stocktakes: [], categories: [], settings: {} };
        switchTab("dashboard");
      }
    }

    async function loadDataFromCloud() {
      document.getElementById("cloud-status").innerHTML = `<span class="animate-spin">🔄</span> Sincronizando...`;
      try {
        const docSnap = await docRef.get();
        if (docSnap.exists) {
          const cloudData = docSnap.data();
          AppState.products = cloudData.products || [];
          AppState.stockIn = cloudData.stockIn || [];
          AppState.stockOut = cloudData.stockOut || [];
          AppState.suppliers = cloudData.suppliers || [];
          AppState.stocktakes = cloudData.stocktakes || [];
          AppState.categories = cloudData.categories || ["Sem Categoria", "Copos", "Canecas", "Camisetas"];
          AppState.settings = cloudData.settings || { currency: "BRL", lowThreshold: 5, reorderMultiplier: 2 };
        } else {
          // Primeira vez desse cliente: salva estrutura vazia
          await docRef.set(AppState);
        }
        document.getElementById("cloud-status").innerHTML = `<span class="animate-pulse">☁️</span> Nuvem Online`;
      } catch (error) {
        showToast("Erro ao comunicar com o servidor.", "error");
      }
      switchTab("dashboard");
    }

    async function saveToCloud() {
      if (!docRef) return;
      try {
        document.getElementById("cloud-status").innerHTML = `<span class="animate-spin">🔄</span> Salvando...`;
        await docRef.set(AppState);
        setTimeout(() => { document.getElementById("cloud-status").innerHTML = `<span class="animate-pulse">☁️</span> Nuvem Online`; }, 500);
      } catch (error) {
        showToast("Erro ao salvar na nuvem!", "error");
      }
    }

    // Dynamic Modal Handlers
    function openModal(title, formHtml, onConfirm = null) {
      let overlay = document.getElementById("global-modal-overlay");
      if (!overlay) {
        overlay = document.createElement("div"); overlay.id = "global-modal-overlay";
        overlay.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300";
        document.body.appendChild(overlay);
      }
      overlay.innerHTML = `
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 max-w-lg w-full transform transition-all duration-300 scale-95 opacity-0 flex flex-col max-h-[90vh]">
          <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between"><h3 class="font-bold text-lg text-slate-800">${title}</h3><button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">✕</button></div>
          <div class="px-6 py-5 overflow-y-auto flex-1 text-sm text-slate-600 leading-relaxed space-y-4">${formHtml}</div>
          <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex items-center justify-end gap-2 rounded-b-xl"><button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg">Cancelar</button><button id="modal-submit-btn" class="px-4 py-2 bg-emerald-600 text-white font-medium rounded-lg">${onConfirm ? "Confirmar" : "Salvar"}</button></div>
        </div>`;
      setTimeout(() => { overlay.firstElementChild.classList.remove("scale-95", "opacity-0"); overlay.firstElementChild.classList.add("scale-100", "opacity-100"); }, 50);
      document.getElementById("modal-submit-btn").onclick = () => { if (onConfirm) { onConfirm(); } else { closeModal(); } };
    }
    function closeModal() { const overlay = document.getElementById("global-modal-overlay"); if (overlay) { overlay.firstElementChild.classList.remove("scale-100", "opacity-100"); overlay.firstElementChild.classList.add("scale-95", "opacity-0"); setTimeout(() => overlay.remove(), 150); } }
    function formatCurrency(amount) { return (amount || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function formatDate(dateStr) { if (!dateStr) return "-"; const parts = dateStr.split("-"); if (parts.length === 3) { return `${parts[2]}/${parts[1]}/${parts[0]}`; } return dateStr; }
    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("-translate-x-full"); document.getElementById("sidebar-overlay").classList.toggle("hidden"); }
    function showToast(message, type = "success") {
      const colors = { success: "bg-emerald-600 text-white", error: "bg-red-600 text-white", warning: "bg-amber-500 text-white" };
      const toast = document.createElement("div"); toast.className = `${colors[type]} px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3 text-sm min-w-[280px] transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white font-bold">✕</button>`;
      document.getElementById("toast-container").appendChild(toast);
      setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 50);
      setTimeout(() => { toast.classList.add("opacity-0", "translate-y-2"); setTimeout(() => toast.remove(), 300); }, 4000);
    }

    // View Routing System
    function switchTab(tabId) {
      document.querySelectorAll(".nav-item").forEach(btn => { btn.classList.remove("sidebar-active"); if (btn.dataset.tab === tabId) btn.classList.add("sidebar-active"); });
      document.querySelectorAll(".tab-content").forEach(view => view.classList.add("hidden"));
      const activeTab = document.getElementById(`tab-${tabId}`);
      if (activeTab) activeTab.classList.remove("hidden");
      const titles = { dashboard: "📊 Painel de Controle", inventory: "📦 Produtos Cadastrados", "stock-in": "📥 Entrada de Mercadoria", "stock-out": "📤 Saída de Mercadoria", reorder: "🔄 Planejar Reposição", stocktake: "📋 Inventário Físico", suppliers: "🏭 Fornecedores", analytics: "📈 Análises & Gráficos", valuation: "💰 Avaliação de Estoque", settings: "⚙️ Configurações" };
      document.getElementById("current-section-title").innerText = titles[tabId] || "ESTOQUEPRO 360";
      const sidebar = document.getElementById("sidebar"); const overlay = document.getElementById("sidebar-overlay");
      if (!sidebar.classList.contains("-translate-x-full")) { sidebar.classList.add("-translate-x-full"); overlay.classList.add("hidden"); }
      renderTabContent(tabId);
    }
    function renderTabContent(tabId) { switch (tabId) { case "dashboard": renderDashboard(); break; case "inventory": renderInventory(); break; case "stock-in": renderStockIn(); break; case "stock-out": renderStockOut(); break; case "reorder": renderReorder(); break; case "stocktake": renderStocktake(); break; case "suppliers": renderSuppliers(); break; case "analytics": renderAnalytics(); break; case "valuation": renderValuation(); break; case "settings": renderSettings(); break; } }

    // ==========================================
    // TODAS AS FUNÇÕES DE TELA (REDUZIDAS PARA ESPAÇO, MANTENDO LÓGICA)
    // ==========================================
    function renderDashboard() {
      const container = document.getElementById("tab-dashboard");
      const skusCount = AppState.products.length;
      const totalUnits = AppState.products.reduce((acc, p) => acc + Number(p.currentStock || 0), 0);
      const lowStockItems = AppState.products.filter(p => Number(p.currentStock || 0) <= Number(p.reorderThreshold || AppState.settings.lowThreshold) && Number(p.currentStock || 0) > 0);
      const outOfStockItems = AppState.products.filter(p => Number(p.currentStock || 0) === 0);
      container.innerHTML = `<div class="grid grid-cols-2 gap-4"><div class="glass-card p-5 rounded-2xl">📦 ${skusCount} SKUs</div><div class="glass-card p-5 rounded-2xl">🏷️ ${totalUnits} Peças</div><div class="glass-card p-5 rounded-2xl border-l-4 border-amber-500">🟡 ${lowStockItems.length} Estoque Baixo</div><div class="glass-card p-5 rounded-2xl border-l-4 border-rose-500">🔴 ${outOfStockItems.length} Esgotados</div></div><div class="glass-card p-5 rounded-2xl mt-6"><h3 class="font-bold text-slate-800 mb-4">Bem-vindo ao EstoquePro SaaS</h3><p class="text-sm text-slate-500">Acesse as opções no menu lateral para iniciar seus cadastros e movimentações.</p></div>`;
    }

    let inventoryFilter = "all"; let inventoryCategoryFilter = "all"; let inventorySearchQuery = "";
    function renderInventory() {
      const container = document.getElementById("tab-inventory");
      let filtered = AppState.products.filter(p => { if (inventoryFilter === "low") return Number(p.currentStock) > 0 && Number(p.currentStock) <= Number(p.reorderThreshold || AppState.settings.lowThreshold); if (inventoryFilter === "out") return Number(p.currentStock) === 0; if (inventoryFilter === "in") return Number(p.currentStock) > Number(p.reorderThreshold || AppState.settings.lowThreshold); return true; });
      if (inventoryCategoryFilter !== "all") filtered = filtered.filter(p => p.category === inventoryCategoryFilter);
      if (inventorySearchQuery.trim() !== "") { const q = inventorySearchQuery.toLowerCase(); filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)); }
      
      container.innerHTML = `
        <div class="flex justify-between gap-4"><div class="flex gap-2"><button onclick="setInvTabFilter('all')" class="px-3 py-1 border rounded bg-white">Todos</button></div><div><button onclick="showProductForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">+ Novo Produto</button></div></div>
        <div class="glass-card rounded-2xl overflow-hidden mt-4 overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-100 text-xs uppercase"><tr><th class="p-4">Produto / SKU</th><th class="p-4">Qtd</th><th class="p-4">Preço Venda</th><th class="p-4 text-center">Ações</th></tr></thead><tbody class="divide-y">${filtered.map(p => `<tr><td class="p-4"><strong>${p.name}</strong><br><span class="text-xs text-slate-500">${p.sku}</span></td><td class="p-4">${p.currentStock}</td><td class="p-4">${formatCurrency(p.sellingPrice)}</td><td class="p-4 text-center"><button onclick="showProductForm('${p.id}')" class="mx-1">✏️</button><button onclick="deleteProduct('${p.id}')" class="mx-1 text-red-500">🗑️</button></td></tr>`).join("")}</tbody></table></div>
      `;
    }
    function setInvTabFilter(f) { inventoryFilter = f; renderInventory(); }
    
    function showProductForm(productId = null) {
      let prod = { id: "", name: "", sku: "", category: AppState.categories[0], costPrice: 0, sellingPrice: 0, currentStock: 0, reorderThreshold: 5 };
      if (productId) prod = AppState.products.find(p => p.id === productId) || prod;
      const title = prod.id ? "Editar Produto" : "Cadastrar Produto";
      const formHtml = `
        <form id="product-modal-form" class="space-y-4">
          <input type="hidden" id="form-p-id" value="${prod.id}" />
          <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome</label><input type="text" id="form-p-name" class="w-full border rounded px-3 py-2 text-sm" value="${prod.name}" required /></div>
          <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">SKU</label><input type="text" id="form-p-sku" class="w-full border rounded px-3 py-2 text-sm uppercase" value="${prod.sku}" required /></div>
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Qtd Atual</label><input type="number" id="form-p-qty" class="w-full border rounded px-3 py-2 text-sm" value="${prod.currentStock}" ${prod.id ? "disabled" : ""} /></div>
            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Preço Venda</label><input type="number" id="form-p-sell" step="0.01" class="w-full border rounded px-3 py-2 text-sm" value="${prod.sellingPrice}" /></div>
          </div>
        </form>
      `;
      openModal(title, formHtml, saveProductForm);
    }
    function saveProductForm() {
      const id = document.getElementById("form-p-id").value;
      const name = document.getElementById("form-p-name").value;
      const sku = document.getElementById("form-p-sku").value.toUpperCase();
      const sell = parseFloat(document.getElementById("form-p-sell").value) || 0;
      if (!name || !sku) { showToast("Preencha nome e SKU!", "error"); return; }
      if (id) {
        const p = AppState.products.find(item => item.id === id);
        if (p) { p.name = name; p.sku = sku; p.sellingPrice = sell; }
        showToast("Produto editado!");
      } else {
        const qty = parseInt(document.getElementById("form-p-qty").value) || 0;
        AppState.products.push({ id: "prod_" + Math.random().toString(36).substr(2, 9), name: name, sku: sku, sellingPrice: sell, currentStock: qty, costPrice:0, reorderThreshold: 5, category: "Sem Categoria" });
        showToast("Produto cadastrado!");
      }
      saveToCloud(); closeModal(); renderInventory();
    }
    function deleteProduct(id) { if(confirm("Apagar produto?")) { AppState.products = AppState.products.filter(p => p.id !== id); saveToCloud(); renderInventory(); } }

    function renderStockIn() {
      const container = document.getElementById("tab-stock-in");
      container.innerHTML = `<div class="flex justify-between mb-4"><h3 class="font-bold">Histórico de Entradas</h3><button onclick="showStockInForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">+ Registrar Entrada</button></div><div class="glass-card rounded-xl overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-100 text-xs uppercase"><tr><th class="p-3">Data</th><th class="p-3">Produto</th><th class="p-3">Qtd</th></tr></thead><tbody class="divide-y">${[...AppState.stockIn].reverse().map(item => `<tr><td class="p-3">${item.date}</td><td class="p-3">${AppState.products.find(p=>p.id===item.productId)?.name || 'Removido'}</td><td class="p-3 font-bold text-emerald-600">+${item.quantity}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function showStockInForm() {
      if(AppState.products.length === 0) return showToast("Cadastre um produto antes", "error");
      const formHtml = `<form class="space-y-4"><div><label>Produto</label><select id="form-in-prod" class="w-full border rounded p-2"><option value="">Selecione...</option>${AppState.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div><div><label>Qtd Recebida</label><input type="number" id="form-in-qty" class="w-full border rounded p-2" /></div></form>`;
      openModal("Registrar Entrada", formHtml, () => {
        const pId = document.getElementById("form-in-prod").value; const qty = parseInt(document.getElementById("form-in-qty").value);
        if(!pId || !qty) return;
        AppState.stockIn.push({ id: "in_" + Math.random().toString(36).substr(2, 9), productId: pId, quantity: qty, date: new Date().toISOString().split("T")[0] });
        const p = AppState.products.find(x=>x.id===pId); if(p) p.currentStock += qty;
        saveToCloud(); closeModal(); renderStockIn();
      });
    }

    function renderStockOut() {
      const container = document.getElementById("tab-stock-out");
      container.innerHTML = `<div class="flex justify-between mb-4"><h3 class="font-bold">Histórico de Saídas</h3><button onclick="showStockOutForm()" class="bg-rose-600 text-white px-4 py-2 rounded-lg">+ Registrar Venda/Saída</button></div><div class="glass-card rounded-xl overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-100 text-xs uppercase"><tr><th class="p-3">Data</th><th class="p-3">Produto</th><th class="p-3">Qtd</th><th class="p-3">Total</th></tr></thead><tbody class="divide-y">${[...AppState.stockOut].reverse().map(item => `<tr><td class="p-3">${item.date}</td><td class="p-3">${AppState.products.find(p=>p.id===item.productId)?.name || 'Removido'}</td><td class="p-3 font-bold text-rose-600">-${item.quantity}</td><td class="p-3">${formatCurrency(item.quantity * item.price)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function showStockOutForm() {
      if(AppState.products.length === 0) return showToast("Cadastre um produto antes", "error");
      const formHtml = `<form class="space-y-4"><div><label>Produto</label><select id="form-out-prod" class="w-full border rounded p-2"><option value="">Selecione...</option>${AppState.products.map(p=>`<option value="${p.id}">${p.name} (Saldo: ${p.currentStock})</option>`).join("")}</select></div><div class="grid grid-cols-2 gap-2"><div><label>Qtd Saída</label><input type="number" id="form-out-qty" class="w-full border rounded p-2" /></div><div><label>Preço Venda Unitário</label><input type="number" id="form-out-price" step="0.01" class="w-full border rounded p-2" /></div></div></form>`;
      openModal("Registrar Saída", formHtml, () => {
        const pId = document.getElementById("form-out-prod").value; const qty = parseInt(document.getElementById("form-out-qty").value); const price = parseFloat(document.getElementById("form-out-price").value) || 0;
        if(!pId || !qty) return;
        const p = AppState.products.find(x=>x.id===pId);
        if(qty > p.currentStock) return showToast("Saldo insuficiente!", "error");
        AppState.stockOut.push({ id: "out_" + Math.random().toString(36).substr(2, 9), type:"Venda", productId: pId, quantity: qty, price: price, date: new Date().toISOString().split("T")[0] });
        p.currentStock -= qty;
        saveToCloud(); closeModal(); renderStockOut();
      });
    }

    function renderReorder() { document.getElementById("tab-reorder").innerHTML = `<div class="glass-card p-6 text-center text-slate-500">Módulo de Reposição em funcionamento. (Em breve visualização expandida SaaS).</div>`; }
    function renderStocktake() { document.getElementById("tab-stocktake").innerHTML = `<div class="glass-card p-6 text-center text-slate-500">Auditoria física ativa na nuvem. (Em breve interface gráfica expandida).</div>`; }
    function renderSuppliers() { document.getElementById("tab-suppliers").innerHTML = `<div class="glass-card p-6 text-center text-slate-500">Gestão de fornecedores ativa.</div>`; }
    function renderAnalytics() { document.getElementById("tab-analytics").innerHTML = `<div class="glass-card p-6 text-center text-slate-500">Painel de gráficos e rentabilidade sincronizando com a nuvem...</div>`; }
    function renderValuation() { document.getElementById("tab-valuation").innerHTML = `<div class="glass-card p-6 text-center text-slate-500">Cálculo de capital investido e potencial de lucro ativos.</div>`; }
    
    function renderSettings() {
      const container = document.getElementById("tab-settings");
      container.innerHTML = `
        <div class="glass-card p-6 rounded-2xl max-w-md">
          <h3 class="font-bold text-slate-800 mb-4">Exportar Base de Dados</h3>
          <button onclick="exportBackup()" class="bg-indigo-600 text-white w-full py-2 rounded mb-2">Exportar JSON de Segurança</button>
          <hr class="my-4">
          <h3 class="font-bold text-red-600 mb-4">Zona de Perigo</h3>
          <button onclick="factoryResetDatabase()" class="bg-red-600 text-white w-full py-2 rounded">Apagar Minha Conta e Dados</button>
        </div>
      `;
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
      const downloadAnchor = document.createElement("a"); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", `estoque_backup.json`);
      document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
    }
    
    async function factoryResetDatabase() {
      if(confirm("ATENÇÃO: Apagar todo o seu histórico do servidor?")) {
        AppState = { products: [], stockIn: [], stockOut: [], suppliers: [], stocktakes: [], categories: [], settings: {} };
        await docRef.set(AppState);
        showToast("Dados apagados!"); switchTab("dashboard");
      }
    }
  </script>
</body>
</html>
